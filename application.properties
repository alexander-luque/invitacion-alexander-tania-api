spring.application.name=invitacion-api
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/invitacion}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.flyway.enabled=true
spring.sql.init.mode=never
management.endpoints.web.exposure.include=health
app.admin-key=${ADMIN_API_KEY:}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:3000}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
